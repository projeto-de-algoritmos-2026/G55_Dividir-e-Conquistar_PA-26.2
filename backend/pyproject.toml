[project]
name = "sismopar-backend"
version = "0.1.0"
description = "API do SismoPar: par de terremotos mais próximo por divisão e conquista"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "pydantic>=2.14.1",
    "pyproj>=3.8.0",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "lento: testes demorados (força bruta geodésica nos catálogos reais); pule com -m \"not lento\"",
]
